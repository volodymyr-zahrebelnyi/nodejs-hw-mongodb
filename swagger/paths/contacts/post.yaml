tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - userId
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contacts's phone number"
            type: string
            example: '+380123456789'
          contactType:
            description: "Contacts's type"
            type: string
            enum: ['work', 'home', 'personal']
          userId:
            description: "Contacts's parent id"
            type: string
            example: 6741fc5faaeb824a58f4b982
          email:
            description: "Contacts's email. Should be between 3 and 20"
            type: string
            example: 'jon.doe@mail.com'
          isFavourite:
            description: 'Is the contact a favorite'
            type: boolean
            example: false
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
